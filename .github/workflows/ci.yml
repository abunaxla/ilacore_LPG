name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ilacore/domain build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Integration tests: with TEST_ADMIN_DATABASE_URL unset, Testcontainers starts PostgreSQL 16 + PostGIS 3.4
      # (matching the VPS). Docker is available on GitHub-hosted Linux runners.
      - run: pnpm --filter @ilacore/api test:int
      - run: pnpm build
